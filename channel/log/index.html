<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6a65;--line:#e2dfd7;--accent:#8a6a1f;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--muted:#9a988f;--line:#33322e;--accent:#d4b062;--card:#1f1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;line-height:1.3}h2{margin-top:2.4rem;padding-top:1rem;border-top:1px solid var(--line);font-size:1.3rem}
h3{font-size:1.05rem;margin-top:1.6rem}
.meta,.note,.limits{color:var(--muted);font-size:.92rem}.q{font-weight:600}
nav{margin:1rem 0;font-size:.95rem}a{color:var(--accent)}
table{border-collapse:collapse;width:100%;margin:.8rem 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
td:first-child{white-space:normal;min-width:9em}
th{color:var(--muted);font-weight:600}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:380px;margin:12vh auto 0}
input{width:100%;font:inherit;padding:8px 10px;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:8px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:#b3261e;min-height:1.4em;font-size:.9rem}
</style>
</head>

<script>
(function(){
  var p=JSON.parse(document.getElementById('payload').textContent);
  function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  async function open(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(p.iv)},key,b(p.data));
    return new TextDecoder().decode(out);
  }
  async function show(pw,remember){
    var text=await open(pw);
    var m=/<title>([^<]*)<\/title>/i.exec(text);if(m)document.title=m[1];var f=document.createElement('iframe');f.srcdoc=text;f.title=document.title;f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';document.body.textContent='';document.body.appendChild(f);
    var h=document.querySelector('#content h1');if(h)document.title=h.textContent;
    if(remember){try{sessionStorage.setItem('locked-pw',pw)}catch(e){}}
  }
  try{var saved=sessionStorage.getItem('locked-pw');if(saved){show(saved,false).catch(function(){})}}catch(e){}
  document.getElementById('unlock').addEventListener('submit',function(e){
    e.preventDefault();var err=document.getElementById('err');err.textContent='解密中…';
    show(document.getElementById('pw').value,true).catch(function(){err.textContent='密碼錯誤'});
  });
})();
</script>
